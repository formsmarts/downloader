[project]
name = "formsmarts-downloader"
version = "1.2.0"
description = "Download your FormSmarts form submissions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "formsmarts>=2.1.7",  # set_user_agent()
    "keyring>=24.0",
    # Verify HTTPS with the OS trust store (the packaged app has no CA bundle)
    "truststore>=0.10; python_version >= '3.10'",
    # Windows Hello protected key storage
    "cryptography>=42; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Security.Credentials>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    # macOS Touch ID protected key storage (signed app builds)
    "pyobjc-framework-Security>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-LocalAuthentication>=10.0; sys_platform == 'darwin'",
    # macOS native date picker
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
fs-downloader = "formsmarts_downloader.cli:main"

[project.gui-scripts]
fs-downloader-gui = "formsmarts_downloader.gui:main"

[tool.setuptools]
packages = ["formsmarts_downloader"]

[tool.setuptools.package-data]
formsmarts_downloader = ["assets/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
